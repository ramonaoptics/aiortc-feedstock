{% set version = "1.14.0" %}

package:
  name: aiortc
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/aiortc/aiortc-{{ version }}.tar.gz
  sha256: adc8a67ace10a085721e588e06a00358ed8eaf5f6b62f0a95358ff45628dd762
  patches:
    - loosen_av_pin.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - aioice >=0.10.1
    - av >=14.0.0
    - cffi >=1.0.0
    - cryptography >=44.0.0
    - google-crc32c >=1.1
    - pyee >=13.0.0
    - pylibsrtp >=0.10.0
    - pyopenssl >=25.0.0

test:
  imports:
    - aiortc
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: An implementation of WebRTC and ORTC
  license: BSD-3-Clause
  license_file: LICENSE
  home: https://github.com/aiortc/aiortc

extra:
  recipe-maintainers:
    - hmaarrfk
