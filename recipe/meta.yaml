{% set version = "1.15.0" %}

package:
  name: aiortc
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/aiortc/aiortc-{{ version }}.tar.gz
  sha256: ee6c0757ca070cf6d6bee441936d6ede24eef51211bbff6653409c540f72e625
  patches:
    - 0001-Customize-h264-properties-and-create-h265-skeleton.patch
    - 0002-Probe-encoder-availability-through-PyAV-instead-of-t.patch
    - 0003-Cap-ICE-reflexive-relay-gather-timeout-avoid-5s-stal.patch
    - 0004-Enable-apple-videotoolbox.patch
    - 0005-Remove-upper-bound-pin-on-av-dependency.patch
    - 0006-Carry-a-frame-s-declared-colour-onto-the-encoder-con.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  string: ramona_pyh{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  # Use a high build number (starting at 100) to indicate ramona optics changes
  number: 102

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - aioice >=0.10.1
    - av >=14.0.0
    - cffi >=1.0.0
    - cryptography >=44.0.0
    - google-crc32c >=1.1
    - pyee >=13.0.0
    - pylibsrtp >=0.10.0
    - pyopenssl >=25.0.0

test:
  imports:
    - aiortc
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: An implementation of WebRTC and ORTC
  license: BSD-3-Clause
  license_file: LICENSE
  home: https://github.com/aiortc/aiortc

extra:
  recipe-maintainers:
    - hmaarrfk
